name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Full verification / Linux Docker / Java 25
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Require Docker for real PostGIS integration tests
        run: docker info
      - name: Validate public files and local infrastructure scripts
        shell: bash
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -B scripts/validate-pack.py
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B scripts/init-dev.py
          export MAINT_LOCAL_DIR="$(python3 -B scripts/init-dev.py --print-local-dir)"
          docker compose --env-file infra/images.lock.env -f infra/compose.dev.yaml config --quiet
      - name: Run unit and mandatory SQL/HTTP integration tests
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Generate resolved dependency SBOM (not an image scan)
        run: ./mvnw --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DincludeTestScope=false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-linux-full
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/bom.json
          if-no-files-found: warn
          retention-days: 7
  windows-unit:
    name: Unit tests and Windows ACL scripts only / Java 25
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Temurin 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run unit tests (not the SQL integration gate)
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress test
      - name: Test private Windows ACL and image lock scripts
        shell: pwsh
        run: py -3.13 -B -m unittest discover -s scripts/tests -v
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-windows-unit
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
