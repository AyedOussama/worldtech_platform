spring:
  application:
    name: maintenance-api
  profiles:
    default: dev
  datasource:
    url: ${MAINT_JDBC_URL}
    username: maint_app
    password: ${runtime_password}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: app.spring_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    read:
      strict-duplicate-detection: true
      include-source-in-location: false
  web:
    resources:
      add-mappings: false

server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: none

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

app:
  onboarding:
    invitation-ttl: 48h
  identity:
    maintenance-enabled: true
    web-absolute: 8h
    recent-authentication: 5m
    password-concurrency: 2
    login-per-identity: 10
    login-per-ip: 60
    mobile:
      access-ttl: 5m
      refresh-idle: 7d
      family-lifetime: 30d
    google:
      enabled: false
      mobile-destinations: {}
    frontend-origin: ${MAINT_FRONTEND_ORIGIN:http://localhost:4200}
    crypto:
      active-key: ${MAINT_ACTIVE_KEY_VERSION:v1}
      keys:
        v1: ${mfa_encryption_key}
  mail:
    enabled: false
