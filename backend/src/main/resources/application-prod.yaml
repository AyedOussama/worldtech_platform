# Migrations run separately. Mount runtime_password and the versioned mfa_encryption_key; never migrator credentials.
spring:
  config:
    import: configtree:/run/secrets/
  flyway:
    enabled: false
server:
  address: 0.0.0.0
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
